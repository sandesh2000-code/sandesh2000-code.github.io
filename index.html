<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavani Electricals & Mitali Enterprises</title>
    <style>
        /* Futuristic Dark Energy Theme Variables */
        :root {
            --bg-dark: #0a0f1d;
            --card-dark: #121829;
            --neon-cyan: #00f2fe;
            --neon-green: #4facfe;
            --neon-whatsapp: #25D366;
            --neon-mail: #ff4e50;
            --text-main: #ffffff;
            --text-muted: #8fa0dd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 70px; /* Space for the floating bottom bar */
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(79, 172, 254, 0.05) 0px, transparent 50%);
        }

        /* Navigation Bar */
        nav {
            background-color: rgba(18, 24, 41, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin: 0 1.2rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--neon-cyan);
        }

        /* Header Block */
        header {
            text-align: center;
            padding: 4rem 1rem;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(180deg, rgba(18,24,41,0.8) 0%, transparent 100%);
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Main Content Wrapper */
        main {
            max-width: 850px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        /* Glass Cards */
        section {
            background-color: var(--card-dark);
            padding: 2.5rem;
            margin-bottom: 2rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        section h2 {
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 1.2rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        section h2::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
            border-radius: 2px;
        }

        section h3 {
            font-size: 1.3rem;
            color: var(--neon-cyan);
            margin: 2.5rem 0 1.2rem 0;
        }

        section p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        ul {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        li {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
        }

        li::before {
            content: "✦";
            color: var(--neon-cyan);
            font-weight: bold;
            margin-right: 12px;
        }

        /* Image Gallery */
        .image-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-top: 1.5rem;
            justify-content: center;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: calc(50% - 0.6rem);
            min-width: 280px;
            height: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gallery-item:hover img {
            transform: scale(1.06);
        }

        .gallery-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(10, 15, 29, 0.95));
            padding: 1rem 0.5rem 0.6rem 0.5rem;
            font-size: 0.9rem;
            text-align: center;
            color: var(--text-main);
            font-weight: 600;
        }

        /* Animated Interactive Contact Grid */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-top: 1.5rem;
        }

        .contact-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.8rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .contact-card svg {
            width: 36px;
            height: 36px;
            margin-bottom: 0.8rem;
            transition: transform 0.3s ease;
        }

        .contact-card span {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .contact-card strong {
            font-size: 1.05rem;
            word-break: break-all;
        }

        /* Hover animations per card type */
        .card-phone:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.15);
            transform: translateY(-5px);
        }
        .card-phone:hover svg { color: var(--neon-cyan); transform: rotate(15deg); }

        .card-whatsapp:hover {
            border-color: var(--neon-whatsapp);
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.15);
            transform: translateY(-5px);
        }
        .card-whatsapp:hover svg { color: var(--neon-whatsapp); transform: scale(1.15); }

        .card-mail:hover {
            border-color: var(--neon-mail);
            box-shadow: 0 5px 20px rgba(255, 78, 80, 0.15);
            transform: translateY(-5px);
        }
        .card-mail:hover svg { color: var(--neon-mail); transform: translateY(-3px); }

        /* Interactive Inquiry Form Design */
        .order-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input, .form-group select {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--neon-cyan);
        }

        .form-group select option {
            background-color: var(--card-dark);
            color: white;
        }

        /* Form Submissions Button */
        .submit-btn {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            color: #0a0f1d;
            border: none;
            padding: 1rem;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        /* Floating Futuristic Bottom Sticky Action Bar */
        .sticky-action-bar {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 500px;
            background: rgba(18, 24, 41, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
